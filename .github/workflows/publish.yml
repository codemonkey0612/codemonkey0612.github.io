# Every morning at 09:00 JST, and on every push to main: copies the Zenn articles that are due
# (published_at reached) to Qiita and note, publishes the Qiita articles (needs the QIITA_TOKEN
# secret) and puts the note copies on note (needs the NOTE_SESSION secret; autopilot.yml
# `note: auto` publishes them, `note: draft` leaves drafts for you), then announces each new
# article on Bluesky (needs the BLUESKY_APP_PASSWORD secret). Zenn publishes itself through its
# GitHub integration. See README.
name: Publish articles

on:
  push:
    branches:
      - main
      - master
  # The morning runs are started on time by the Cloudflare Worker in clock/ (08:50 JST with
  # at: 09:00, and 09:20 JST for anything missed). GitHub's own schedule below is only a
  # fallback: it starts runs hours late or not at all when GitHub is busy (on 2026-11-10 the
  # 08:40 run started at 13:45). The first run to start before 09:00 waits until 09:00 and posts;
  # the others queue behind it (see concurrency) and then find nothing left to do.
  schedule:
    - cron: "47 18 * * *" # 03:47 JST
    - cron: "47 19 * * *" # 04:47 JST
    - cron: "47 20 * * *" # 05:47 JST
    - cron: "47 21 * * *" # 06:47 JST
    - cron: "47 22 * * *" # 07:47 JST
    - cron: "37 23 * * *" # 08:37 JST
  workflow_dispatch:
    inputs:
      at:
        description: "Wait until this time (JST, HH:MM) before posting. Empty: post now."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    # Long enough for the wait until 09:00 (up to 5½ h, scripts/crosspost.mjs) plus posting.
    timeout-minutes: 345
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
      NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
    steps:
      # The branch's latest commit, not the one from when the run was queued: a run that waited
      # behind this morning's post must see the note ids it recorded, or it would post again.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # autopilot.yml `qiita: off` stops everything Qiita (no copies, no qiita-cli); `manual` makes
      # no copies but still publishes the Qiita articles you prepared in public/.
      - name: Read settings
        id: settings
        run: echo "qiita=$(node -e 'const y=require("yaml");const fs=require("fs");console.log(y.parse(fs.readFileSync("autopilot.yml","utf8"))?.qiita ?? "auto")')" >> "$GITHUB_OUTPUT"

      # Zenn publishes each article itself at its published_at; this makes the Qiita and note
      # copies (with a note header image) of every article that's due. On the daily run (GitHub's
      # schedule, or the clock Worker's start with at: 09:00) it first waits until 09:00 JST.
      - name: Copy due Zenn articles to Qiita and note
        env:
          AT: ${{ github.event_name == 'schedule' && '09:00' || inputs.at }}
        run: |
          if [[ "$AT" =~ ^[0-2][0-9]:[0-5][0-9]$ ]]; then node scripts/crosspost.mjs --at "$AT"; else node scripts/crosspost.mjs; fi

      # autopilot.yml `qiita: daily`: puts the morning's Qiita article (written by the autopilot in
      # qiita/) into public/ for qiita-cli. At most one new Qiita article a day; none while
      # qiita/PAUSED exists (written when Qiita hides or refuses one of your posts).
      - name: Prepare today's Qiita article
        id: qiita_daily
        if: env.QIITA_TOKEN != '' && steps.settings.outputs.qiita == 'daily'
        run: node scripts/qiita-daily.mjs

      # Stop before publishing anything broken (bad tags, TODOs, promotional links on Qiita).
      # A failure here stops only Qiita; note and Bluesky still post.
      - name: Validate Qiita articles
        id: qiita_validate
        continue-on-error: true
        run: |
          shopt -s nullglob
          files=(public/*.md)
          if [ ${#files[@]} -gt 0 ]; then node scripts/validate.mjs "${files[@]}"; fi

      # Until the QIITA_TOKEN secret is added, validate only and skip publishing.
      - name: Note that Qiita is not connected yet
        if: env.QIITA_TOKEN == ''
        run: echo "::notice::QIITA_TOKEN secret is not set, so Qiita publishing was skipped."

      # A Qiita failure doesn't stop the note post below; the last step fails the run afterwards.
      - name: Publish to Qiita
        id: qiita
        if: env.QIITA_TOKEN != '' && steps.settings.outputs.qiita != 'off' && steps.qiita_validate.outcome == 'success'
        continue-on-error: true
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."

      # If Qiita refused a new article, mark it ignorePublish so the next runs don't send it again
      # (repeated attempts from a new account look like spam). Set it back to false to retry.
      - name: Hold back the articles Qiita refused
        if: steps.qiita.outcome == 'failure'
        run: |
          node scripts/qiita-hold.mjs
          if [ -n "$(git status --porcelain -- public qiita)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add public
            if [ -d qiita ]; then git add qiita; fi
            git commit -m "Hold back the Qiita articles Qiita refused"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      # note has no posting API for individual accounts, so this uses the endpoints note's own
      # editor uses, signed in with your cookie. Until NOTE_SESSION is set, skip.
      - name: Note that note is not connected yet
        if: env.NOTE_SESSION == ''
        run: echo "::notice::NOTE_SESSION secret is not set, so nothing was posted to note."

      - name: Post to note
        if: env.NOTE_SESSION != ''
        run: node scripts/note-draft.mjs

      # One Bluesky post per new Zenn article, through Bluesky's official API with an App
      # Password. Runs even if the note step failed (it posts only articles already live on
      # Zenn, so never before 09:00). Until BLUESKY_APP_PASSWORD is set, skip.
      - name: Note that Bluesky is not connected yet
        if: env.BLUESKY_APP_PASSWORD == ''
        run: echo "::notice::BLUESKY_APP_PASSWORD secret is not set, so nothing was posted to Bluesky."

      - name: Post to Bluesky
        if: ${{ !cancelled() && env.BLUESKY_APP_PASSWORD != '' }}
        run: node scripts/bluesky-post.mjs

      # Record each note post's id and link (and the copies and header images), and each Bluesky
      # post, so the next run updates the same note post and never posts twice. Runs even if a
      # post failed.
      - name: Commit post records
        if: always() && (env.NOTE_SESSION != '' || env.BLUESKY_APP_PASSWORD != '' || env.QIITA_TOKEN != '')
        run: |
          paths=()
          if [ -n "$NOTE_SESSION" ]; then paths+=(notes); fi
          if [ -n "$BLUESKY_APP_PASSWORD" ] && [ -d social ]; then paths+=(social); fi
          if [ -n "$QIITA_TOKEN" ]; then for d in public qiita; do if [ -d "$d" ]; then paths+=("$d"); fi; done; fi
          if [ ${#paths[@]} -gt 0 ] && [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- "${paths[@]}"
            git commit -m "Record posts"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Fail the run if Qiita failed
        if: always() && (steps.qiita.outcome == 'failure' || steps.qiita_validate.outcome == 'failure' || steps.qiita_daily.outputs.paused_now == 'true' || steps.qiita_daily.outputs.failed == 'true')
        run: |
          echo "::error::Qiita: see the Prepare / Validate / Publish to Qiita steps. A post Qiita refused is set to ignorePublish: true, and daily Qiita posts pause (qiita/PAUSED) when Qiita refuses or hides one."
          exit 1
