# Publishes Qiita articles on every push to main (generated by `npx qiita init`,
# plus a validation step). Needs the QIITA_TOKEN repository secret.
# Zenn publishes itself through its GitHub integration; see README.
name: Publish articles

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Stop before publishing anything broken (missing call to action, TODOs, bad tags).
      - name: Validate Qiita articles
        run: |
          shopt -s nullglob
          files=(public/*.md)
          if [ ${#files[@]} -gt 0 ]; then node scripts/validate.mjs "${files[@]}"; fi

      # Until the QIITA_TOKEN secret is added, validate only and skip publishing.
      - name: Note that Qiita is not connected yet
        if: env.QIITA_TOKEN == ''
        run: echo "::notice::QIITA_TOKEN secret is not set, so Qiita publishing was skipped."

      - if: env.QIITA_TOKEN != ''
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."
