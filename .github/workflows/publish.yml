# Every morning at 09:00 JST, and on every push to main: copies the Zenn articles that are due
# (published_at reached) to Qiita and note, publishes the Qiita articles (needs the QIITA_TOKEN
# secret) and puts the note copies on note (needs the NOTE_SESSION secret; autopilot.yml
# `note: auto` publishes them, `note: draft` leaves drafts for you). Zenn publishes itself
# through its GitHub integration. See README.
name: Publish articles

on:
  push:
    branches:
      - main
      - master
  # GitHub starts scheduled runs late when it's busy (on 2026-11-10 the 08:40 run started at
  # 13:45), so the job is scheduled several times from 03:47 JST. The first run to start before
  # 09:00 waits until 09:00 and posts; the others queue behind it (see concurrency) and then find
  # nothing left to do. If every run is late, the first one posts as soon as it starts.
  schedule:
    - cron: "47 18 * * *" # 03:47 JST
    - cron: "47 19 * * *" # 04:47 JST
    - cron: "47 20 * * *" # 05:47 JST
    - cron: "47 21 * * *" # 06:47 JST
    - cron: "47 22 * * *" # 07:47 JST
    - cron: "37 23 * * *" # 08:37 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish_articles:
    runs-on: ubuntu-latest
    # Long enough for the wait until 09:00 (up to 5½ h, scripts/crosspost.mjs) plus posting.
    timeout-minutes: 345
    env:
      QIITA_TOKEN: ${{ secrets.QIITA_TOKEN }}
      NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
    steps:
      # The branch's latest commit, not the one from when the run was queued: a run that waited
      # behind this morning's post must see the note ids it recorded, or it would post again.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # autopilot.yml `qiita: off` stops everything Qiita (no copies, no qiita-cli).
      - name: Read settings
        id: settings
        run: echo "qiita=$(node -e 'const y=require("yaml");const fs=require("fs");console.log(y.parse(fs.readFileSync("autopilot.yml","utf8"))?.qiita ?? "auto")')" >> "$GITHUB_OUTPUT"

      # Zenn publishes each article itself at its published_at; this makes the Qiita and note
      # copies (with a note header image) of every article that's due. On the daily run it
      # first waits until 09:00 JST.
      - name: Copy due Zenn articles to Qiita and note
        run: node scripts/crosspost.mjs ${{ github.event_name == 'schedule' && '--at 09:00' || '' }}

      # Stop before publishing anything broken (missing call to action, TODOs, bad tags).
      - name: Validate Qiita articles
        run: |
          shopt -s nullglob
          files=(public/*.md)
          if [ ${#files[@]} -gt 0 ]; then node scripts/validate.mjs "${files[@]}"; fi

      # Until the QIITA_TOKEN secret is added, validate only and skip publishing.
      - name: Note that Qiita is not connected yet
        if: env.QIITA_TOKEN == ''
        run: echo "::notice::QIITA_TOKEN secret is not set, so Qiita publishing was skipped."

      - if: env.QIITA_TOKEN != '' && steps.settings.outputs.qiita != 'off'
        uses: increments/qiita-cli/actions/publish@v1
        with:
          qiita-token: ${{ secrets.QIITA_TOKEN }}
          root: "."

      # note has no posting API for individual accounts, so this uses the endpoints note's own
      # editor uses, signed in with your cookie. Until NOTE_SESSION is set, skip.
      - name: Note that note is not connected yet
        if: env.NOTE_SESSION == ''
        run: echo "::notice::NOTE_SESSION secret is not set, so nothing was posted to note."

      - name: Post to note
        if: env.NOTE_SESSION != ''
        run: node scripts/note-draft.mjs

      # Record each note post's id and link (and the copies and header images) so the next run
      # updates the same post rather than making a new one. Runs even if a post failed.
      - name: Commit note ids
        if: always() && env.NOTE_SESSION != ''
        run: |
          if [ -n "$(git status --porcelain -- notes)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add notes
            git commit -m "Record note posts"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
