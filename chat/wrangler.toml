# The site assistant (the 「質問する」 button on shanaiai.com). Setup: chat/README.md.
# Secret (never here): ANTHROPIC_API_KEY — `wrangler secret put ANTHROPIC_API_KEY`.
name = "takumi-chat"
main = "src/worker.mjs"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "chat.shanaiai.com", custom_domain = true }]

[vars]
ALLOWED_ORIGINS = "https://shanaiai.com,https://codemonkey0612.github.io"
SITE_URL = "https://shanaiai.com/"
# The knowledge base the site build writes (dist/site/assets/kb.json).
KB_URL = "https://shanaiai.com/assets/kb.json"
# Questions answered per day for the whole site (a cost ceiling).
DAILY_CAP = "300"

# Per-visitor counters (hashed IP, 10 minutes) and the daily count.
[[kv_namespaces]]
binding = "CHAT_KV"
id = "fd48ea7f05064ff9bb20dcdef08b3a37"

[observability]
enabled = true
