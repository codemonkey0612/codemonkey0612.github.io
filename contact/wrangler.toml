# Inquiry form endpoint for the site's /contact/ page. Setup: contact/README.md.
# No secrets here: RESEND_API_KEY, CONTACT_TO and CONTACT_FROM are set with
# `npx wrangler secret put <NAME>` and never committed.
name = "takumi-contact"
main = "src/worker.mjs"
compatibility_date = "2025-10-01"
# Served at https://form.shanaiai.com/ (a Workers Custom Domain: Cloudflare creates the DNS
# record and certificate). No workers.dev address.
workers_dev = false
preview_urls = false
routes = [{ pattern = "form.shanaiai.com", custom_domain = true }]

[vars]
# Sites allowed to post (comma-separated, no trailing slash). For local testing add
# http://localhost:4321 in contact/.dev.vars instead of here.
ALLOWED_ORIGINS = "https://shanaiai.com,https://codemonkey0612.github.io"
# Mail goes out through Resend (RESEND_API_KEY secret). SMTP through your own mailbox is
# supported (SMTP_HOST/SMTP_PORT here + SMTP_USER/SMTP_PASS secrets) but not usable with
# Hostinger: smtp.hostinger.com sits on Cloudflare IPs, which Workers sockets can't reach.

# Rate-limit counters (hashed IP, 10 minutes) and idempotency keys (24 hours).
[[kv_namespaces]]
binding = "CONTACT_KV"
id = "7c43498b05dd49c5b0e51f6ce4103f67"

[observability]
enabled = true
