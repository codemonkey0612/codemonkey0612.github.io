# note header images (見出し画像, 1280×670): one per Lancers package image.
#
# scripts/note-covers.mjs renders notes/covers/<id>.jpg from `original` in the portfolio folder
# (../portfolio); run it again after you change a package image. scripts/crosspost.mjs gives
# each new note post the image whose keywords best match the article: a keyword equal to one of
# the Zenn topics counts 3, one in the title counts 2. Ties go to the image used least so far;
# with no match at all, the `default: true` image is used. Your own notes/<slug>.png or .jpg
# always wins.
#
# Only 16:9 images: each is cropped to fill 1280×670, and `y` is which part of the height to
# keep (0 top, 0.5 middle, 1 bottom). note-covers refuses a 4:3 or square image, which would
# need its sides filled in.
#
# Not here on purpose: face swap, AI business matching, scraping and game development. Also
# not here: the 民泊・求人 matching system (1319670), whose package image is 4:3 with no 16:9
# version.

