# note header images (見出し画像, 1280×670): the mascot series, 30 images made with ChatGPT
# on 2026-11-25 from ../note-covers/prompts.md (one theme each, the same navy-and-gold robot
# craftsman). Until then these were the Lancers package images; those files stay in this folder
# because earlier note posts use them, but they're no longer offered.
#
# scripts/note-covers.mjs renders notes/covers/<id>.jpg from `original`:
#   npm run note:covers -- --from ../note-covers
# scripts/crosspost.mjs gives each new note post an image: first the ones used least so far (so
# all 30 are used before any repeats), and among those the one whose keywords best match the
# article (a keyword equal to one of its topics counts 3, one in its title 2). Your own
# notes/<slug>.png or .jpg always wins.

