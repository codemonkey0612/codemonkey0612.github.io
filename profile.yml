# What you sell. Each service has a page at <site_url>services/<id>/ built from
# site/services/<id>.md. `npm run new -- … --service <id>` links a post to it.
services:
  - id: ai-apps
    pillar: AI
    name: 生成AI・ChatGPT業務アプリ開発
    summary: ChatGPTなどの生成AIを業務に組み込み、文書作成・要約・データ整理などの手作業を減らすアプリを作ります。
  - id: ai-chatbot
    pillar: AI
    name: AIチャットボット・社内文書検索（RAG）
    summary: 社内マニュアルやFAQをもとに、参照元を示して答えるチャットボットを作ります。Web・LINEに対応します。
  - id: ai-consulting
    pillar: AI
    name: 生成AI導入コンサルティング・技術相談
    summary: どの業務にAIを使うべきかを整理し、ツール選定から検証（PoC）、導入計画までを支援します。
  - id: ai-infra
    pillar: AI
    name: 生成AI基盤・クラウド/サーバー構築
    summary: AWS・Azureで、認証・ログ管理を備えた業務用の生成AI基盤やサーバー環境を構築・移行します。
  - id: wordpress
    pillar: Web・EC
    name: WordPress・Webサイト制作
    summary: WordPressでの企業サイト制作・リニューアル・移行・保守、HTML/CSSコーディングまで対応します。
  - id: shopify
    pillar: Web・EC
    name: Shopify・ECサイト構築
    summary: Shopifyでのネットショップ構築・移行と、商品数や在庫管理の手間を減らす仕組みづくりを支援します。
  - id: system
    pillar: システム開発
    name: Web・業務システム／アプリ開発
    summary: 予約・マッチング・管理画面などのWebシステム、スマホアプリ、業務ツール、データ収集ツールを開発します。
  - id: quality
    pillar: 品質・セキュリティ
    name: 不具合調査・コードレビュー・セキュリティ診断
    summary: 引き継いだシステムの不具合を原因から調べて直し、コードとセキュリティの問題点を報告します。

