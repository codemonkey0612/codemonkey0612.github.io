<!doctype html>
<!-- Build-time page for scripts/site-scenes.mjs: renders one scene still. Not deployed. -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
const q = new URLSearchParams(location.search);
const c = document.getElementById("c");
c.style.width = q.get("w") + "px";
c.style.height = q.get("h") + "px";
try {
  const { still } = await import(`../assets/celestial.js?v=${Date.now()}`);
  await still(c, q.get("s"), q.get("layout") || "wide", "../assets/");
  window.__sceneReady = true;
} catch (e) {
  window.__sceneError = String(e && e.stack || e);
}
</script></body></html>
